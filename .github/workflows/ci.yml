name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: >
          xcodebuild -scheme PaashERP
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build
          build

      - name: Test
        run: >
          xcodebuild -scheme PaashERP
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath build
          test